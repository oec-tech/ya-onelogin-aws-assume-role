[project]
site_name = "ya-onelogin-aws-assume-role (unofficial fork)"
site_description = "Assume AWS roles with OneLogin: config file, keyring, MFA push and automatic renewal."
site_url = "https://oec-tech.github.io/ya-onelogin-aws-assume-role/"
repo_url = "https://github.com/oec-tech/ya-onelogin-aws-assume-role"
repo_name = "oec-tech/ya-onelogin-aws-assume-role"
edit_uri = "edit/master/docs/"
nav = [
  { "Overview" = "index.md" },
  { "Install" = "install.md" },
  { "Configuration" = "configuration.md" },
  { "Your password" = "password.md" },
  { "MFA and menus" = "mfa.md" },
  { "Automatic renewal" = "credential-process.md" },
  { "Session length" = "session-length.md" },
  { "Usage" = "usage.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
